<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>JobTrail</title>
  <link rel="stylesheet" href="../fonts/fonts.css">
  <link rel="stylesheet" href="popup.css">
</head>

<body>

  <!-- Triage center: shows actionable jobs at a glance -->
  <div id="triage-state">
    <header class="popup-header">
      <div class="brand">Job<em>Trail</em></div>
      <button id="top-dash-btn" class="open-dash-link" title="Open the full board">Board &nearr;</button>
    </header>

    <div class="summary-strip">
      <div class="summary-eyebrow">Today</div>
      <div id="summary-text" class="summary-text">Counting&hellip;</div>
    </div>

    <ol class="job-list" id="triage-list"></ol>

    <div class="popup-footer">
      <button id="bottom-dash-btn" class="full-dash-btn">Open the board</button>
    </div>
  </div>

  <script src="../utils/storage-crud.js"></script>
  <script src="../utils/storage-analytics.js"></script>
  <script src="popup-triage.js"></script>
  <script src="popup.js"></script>
</body>

</html>
